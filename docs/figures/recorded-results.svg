<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="title desc"><title id="title">Saved Cyera experiment results</title><desc id="desc">AI macro F1 on 341 resolved labels; category metrics on 89 homepages. Historical results, not a fresh test.</desc><rect width="860" height="390" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="24" y="35" font-size="22" font-weight="bold">Recorded experimental results</text><text x="24" y="61" font-size="13">AI: 341 resolved-label pages • Category: 89 homepages • Scores on a 0–1 scale</text><text x="24" y="112" font-size="14">Keyword rule: macro-F1</text><rect x="300" y="95" width="460" height="25" rx="4" fill="#e2e8f0"/><rect x="300" y="95" width="409.088" height="25" rx="4" fill="#2563eb"/><text x="777" y="113" font-size="14">0.889</text><text x="24" y="160" font-size="14">Gated Jev: macro-F1</text><rect x="300" y="143" width="460" height="25" rx="4" fill="#e2e8f0"/><rect x="300" y="143" width="428.425" height="25" rx="4" fill="#2563eb"/><text x="777" y="161" font-size="14">0.931</text><text x="24" y="208" font-size="14">Category: all-answer accuracy</text><rect x="300" y="191" width="460" height="25" rx="4" fill="#e2e8f0"/><rect x="300" y="191" width="242.921" height="25" rx="4" fill="#0f766e"/><text x="777" y="209" font-size="14">0.528</text><text x="24" y="256" font-size="14">Category: answered-only accuracy</text><rect x="300" y="239" width="460" height="25" rx="4" fill="#e2e8f0"/><rect x="300" y="239" width="291.020" height="25" rx="4" fill="#0f766e"/><text x="777" y="257" font-size="14">0.633</text><text x="24" y="304" font-size="14">Category: coverage</text><rect x="300" y="287" width="460" height="25" rx="4" fill="#e2e8f0"/><rect x="300" y="287" width="253.258" height="25" rx="4" fill="#0f766e"/><text x="777" y="305" font-size="14">0.551</text><text x="24" y="365" font-size="13">Separate tasks and denominators; repeated test use limits 