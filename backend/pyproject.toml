[project]
name = "ai-tool-governance-backend"
version = "0.1.0"
description = "FastAPI backend for AI tool discovery and contextual governance-risk analysis"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
