[project]
name = "ai-tool-governance-backend"
version = "0.1.0"
description = "FastAPI backend for AI tool discovery and contextual governance-risk analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
